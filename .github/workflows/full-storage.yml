name: Compare unchanged full fleet across allocated Windows temp locations
on:
  push:
    branches: [diagnostics/c156-windows-full-storage]
permissions:
  contents: read
jobs:
  fleet-profile:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain observer outside the unchanged application source
        shell: pwsh
        run: |
          Copy-Item -LiteralPath '.github/diagnostics/fleet_storage_observer.py' -Destination "$env:RUNNER_TEMP/fleet_storage_observer.py"
          Copy-Item -LiteralPath '.github/diagnostics/paired_storage_driver.py' -Destination "$env:RUNNER_TEMP/paired_storage_driver.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5ee5b56572e9fc92d64bc1f3447a93678bd18bfd
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Verify exact observer and approved detached review
        shell: pwsh
        run: |
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$env:RUNNER_TEMP/fleet_storage_observer.py").Hash.ToLowerInvariant() -ne '9347e12c2087a3ec789c7d0db9473058b6c3a25694c35584870b74a98dd769d9') { throw 'Observer identity mismatch' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$env:RUNNER_TEMP/paired_storage_driver.py").Hash.ToLowerInvariant() -ne '34be7011c98c123706f5801ec7da50495d099e9b6f074237542240243d77035c') { throw 'Parent identity mismatch' }
          & curl.exe --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 --max-filesize 1399933 --output "$env:RUNNER_TEMP/swassh-approved-review.json" https://raw.githubusercontent.com/irivengroup/swassh/0ccf2df279733b8ded0d714b51169db3b0357d4f/.sast-approval/review.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath "$env:RUNNER_TEMP/swassh-approved-review.json").Length -ne 1399933) { throw 'Review length mismatch' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$env:RUNNER_TEMP/swassh-approved-review.json").Hash.ToLowerInvariant() -ne '62e93faf3de43884f6fa8b0c2e0fe7dc7a3ad78d9958130a42967f74649e60f6') { throw 'Review identity mismatch' }
      - name: Run both unchanged 50000-host tests on the same Windows VM
        id: diagnostic
        shell: pwsh
        timeout-minutes: 28
        run: |
          $env:SWASSH_DIAG_SOURCE = $env:GITHUB_WORKSPACE
          $env:SWASSH_DIAG_OUTPUT = "$env:RUNNER_TEMP/swassh-full-storage"
          $env:SWASSH_DIAG_REVIEW = "$env:RUNNER_TEMP/swassh-approved-review.json"
          $env:SWASSH_DIAG_OBSERVER_SHA256 = '9347e12c2087a3ec789c7d0db9473058b6c3a25694c35584870b74a98dd769d9'
          & python -B "$env:RUNNER_TEMP/paired_storage_driver.py" *> "$env:RUNNER_TEMP/swassh-full-storage.log"
          exit $LASTEXITCODE
      - name: Retain profiles and every observed outcome
        if: ${{ always() && (steps.diagnostic.outcome == 'success' || steps.diagnostic.outcome == 'failure' || steps.diagnostic.outcome == 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-full-storage-c156
          path: |
            ${{ runner.temp }}/swassh-full-storage/
            ${{ runner.temp }}/swassh-full-storage.log
          if-no-files-found: error

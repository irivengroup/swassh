name: Observe approved C148 Windows idle relay
on:
  push:
    branches: [diagnostics/c148-windows-relay]
permissions:
  contents: read
jobs:
  relay-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Keep the observer outside application sources
        shell: pwsh
        run: Copy-Item -LiteralPath .github/diagnostics/windows_relay_diagnostic.py -Destination "$env:RUNNER_TEMP/relay-diagnostic.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5b125ca1b472bf6e87c75ea0fe60f0f9ab6f8e5b
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.10'
      - name: Verify observer and exact operator authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/relay-diagnostic.py" -Algorithm SHA256).Hash.ToLowerInvariant() -cne '9b700cc602b4fe3eb355d7d6aea14d4dccf305fa96a92ab6489712fdeaf6ff76') { throw 'Observer changed' }
          & "$env:WINDIR/System32/curl.exe" --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 --max-filesize 1081308 --output "$env:RUNNER_TEMP/approved-review.json" https://raw.githubusercontent.com/irivengroup/swassh/09ba8df129e2b2235d23513f55dbba4441c8959f/.sast-approval/review.json
          if ((Get-Item -LiteralPath "$env:RUNNER_TEMP/approved-review.json").Length -ne 1081308) { throw 'Review size differs' }
          if ((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/approved-review.json" -Algorithm SHA256).Hash.ToLowerInvariant() -cne '98f2161a4507d3112c8ec06de4b7b8b50de85f283b813898e6e146c06c5a0c29') { throw 'Review changed' }
      - name: Observe twenty original idle assertions without changing timers
        id: diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/src"
          python -B "$env:RUNNER_TEMP/relay-diagnostic.py" --root "$env:GITHUB_WORKSPACE" --review "$env:RUNNER_TEMP/approved-review.json" --output "$env:RUNNER_TEMP/relay-diagnostic"
      - name: Preserve every original success and failure
        if: ${{ always() && (steps.diagnostic.outcome == 'success' || steps.diagnostic.outcome == 'failure' || steps.diagnostic.outcome == 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-relay-diagnostic-c148
          path: ${{ runner.temp }}/relay-diagnostic/
          if-no-files-found: error

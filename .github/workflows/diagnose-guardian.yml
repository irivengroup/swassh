name: Diagnose unchanged macOS guardian fixture
on:
  push:
    branches: [diagnostics/c146-macos-guardian]
permissions:
  contents: read
jobs:
  guardian-diagnostic:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain the bounded synthetic diagnostic outside application sources
        shell: bash
        run: cp .github/diagnostics/guardian_diagnostic.py "$RUNNER_TEMP/swassh-guardian-diagnostic.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 65f82c0cf0b638461760d4fabed27f9e0f070c64
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Verify the diagnostic and exact actual operator approval
        shell: bash
        run: |
          set -euo pipefail
          test "$(shasum -a 256 "$RUNNER_TEMP/swassh-guardian-diagnostic.py" | cut -d' ' -f1)" = 5c84de2b71b31e4836f48e251f4c4e126e7098fd4df397ee3da99be176d01db6
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --max-filesize 1048576 --output "$RUNNER_TEMP/swassh-approved-review.json" \
            https://raw.githubusercontent.com/irivengroup/swassh/6b97c88d347fbda5178a3bd825d8fddf196cd200/.sast-approval/review.json
          test "$(shasum -a 256 "$RUNNER_TEMP/swassh-approved-review.json" | cut -d' ' -f1)" = 045a6cf0f9bb3d9f7044aac1c636b7fdd1c96cd5d7a91dfd69d3ac0524ef5eb4
      - name: Observe original synthetic leader-exit assertions with native exception context
        shell: bash
        run: python -B "$RUNNER_TEMP/swassh-guardian-diagnostic.py" --root "$GITHUB_WORKSPACE" --review "$RUNNER_TEMP/swassh-approved-review.json" --output "$RUNNER_TEMP/swassh-guardian-diagnostic" --iterations 50
      - name: Retain every diagnostic outcome including failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-diagnostic
          path: |
            ${{ runner.temp }}/swassh-guardian-diagnostic/receipt.json
            ${{ runner.temp }}/swassh-guardian-diagnostic/tests.log
          if-no-files-found: error

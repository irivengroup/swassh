name: Validate approved C154 native regressions
on:
  push:
    branches: [diagnostics/c154-macos-validation]
permissions:
  contents: read
jobs:
  benchmark-diagnostic:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain diagnostic outside application sources
        shell: bash
        run: cp .github/diagnostics/benchmark_diagnostic.py "$RUNNER_TEMP/swassh-core-diagnostic.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5ee5b56572e9fc92d64bc1f3447a93678bd18bfd
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Verify fixed external diagnostic and actual C154 operator authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(shasum -a 256 "$RUNNER_TEMP/swassh-core-diagnostic.py" | cut -d' ' -f1)" = a5bd5762d3e6efdb27a56a59f505b22f7cfb3992ad5996d758e72ae43ce9bc99
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 --max-filesize 1399933 --output "$RUNNER_TEMP/swassh-approved-review.json" https://raw.githubusercontent.com/irivengroup/swassh/0ccf2df279733b8ded0d714b51169db3b0357d4f/.sast-approval/review.json
          test "$(wc -c < "$RUNNER_TEMP/swassh-approved-review.json" | tr -d ' ')" = 1399933
          test "$(shasum -a 256 "$RUNNER_TEMP/swassh-approved-review.json" | cut -d' ' -f1)" = 62e93faf3de43884f6fa8b0c2e0fe7dc7a3ad78d9958130a42967f74649e60f6
      - name: Observe twenty fresh original runs then ten traced runs with unchanged assertions
        id: diagnostic
        shell: bash
        run: python -B "$RUNNER_TEMP/swassh-core-diagnostic.py" --root "$GITHUB_WORKSPACE" --review "$RUNNER_TEMP/swassh-approved-review.json" --output "$RUNNER_TEMP/swassh-core-diagnostic"
      - name: Retain every observed success and failure
        if: ${{ always() && (steps.diagnostic.outcome == 'success' || steps.diagnostic.outcome == 'failure' || steps.diagnostic.outcome == 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-fresh-diagnostic-c154
          path: ${{ runner.temp }}/swassh-core-diagnostic/
          if-no-files-found: error
  guardian-diagnostic:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain the bounded synthetic diagnostic outside application sources
        shell: bash
        run: cp .github/diagnostics/guardian_diagnostic.py "$RUNNER_TEMP/swassh-guardian-diagnostic.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5ee5b56572e9fc92d64bc1f3447a93678bd18bfd
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Verify the diagnostic and exact actual operator approval
        shell: bash
        run: |
          set -euo pipefail
          test "$(shasum -a 256 "$RUNNER_TEMP/swassh-guardian-diagnostic.py" | cut -d' ' -f1)" = a14d8e7b05200837b071c5d383a43ed111f23fb2024213b100498ec33008407b
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --max-filesize 1399933 --output "$RUNNER_TEMP/swassh-approved-review.json" \
            https://raw.githubusercontent.com/irivengroup/swassh/0ccf2df279733b8ded0d714b51169db3b0357d4f/.sast-approval/review.json
          test "$(wc -c < "$RUNNER_TEMP/swassh-approved-review.json" | tr -d ' ')" = 1399933
          test "$(shasum -a 256 "$RUNNER_TEMP/swassh-approved-review.json" | cut -d' ' -f1)" = 62e93faf3de43884f6fa8b0c2e0fe7dc7a3ad78d9958130a42967f74649e60f6
      - name: Observe original synthetic leader-exit assertions with native exception context
        shell: bash
        run: python -B "$RUNNER_TEMP/swassh-guardian-diagnostic.py" --root "$GITHUB_WORKSPACE" --review "$RUNNER_TEMP/swassh-approved-review.json" --output "$RUNNER_TEMP/swassh-guardian-diagnostic" --iterations 50
      - name: Retain every diagnostic outcome including failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-after-c154
          path: |
            ${{ runner.temp }}/swassh-guardian-diagnostic/receipt.json
            ${{ runner.temp }}/swassh-guardian-diagnostic/tests.log
          if-no-files-found: error

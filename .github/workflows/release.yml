name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check tag and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert os.environ['RELEASE_TAG'] == 'v'+v, 'tag/version mismatch'"
      # Promote the bytes produced by the gated quality job; do not rebuild.
      - name: Require a fresh artifact directory
        shell: bash
        run: test ! -e qualified-dist && test ! -L qualified-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: qualified-dist
      - name: Verify qualified artifact checksums
        shell: bash
        working-directory: qualified-dist
        run: sha256sum --strict --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: qualified-dist/
  github:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
  pypi:
    needs: [build, github]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Select Python distributions
        run: |
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/

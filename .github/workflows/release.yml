name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check tag and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert os.environ['RELEASE_TAG'] == 'v'+v, 'tag/version mismatch'"
      # Promote the bytes produced by the gated quality job; do not rebuild.
      - name: Require a fresh artifact directory
        shell: bash
        run: test ! -e qualified-dist && test ! -L qualified-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: qualified-dist
      - name: Verify qualified artifact checksums
        shell: bash
        working-directory: qualified-dist
        run: sha256sum --strict --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: qualified-dist/
  github:
    needs: build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
  pypi:
    needs: [build, github]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Select Python distributions
        run: |
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: publish/

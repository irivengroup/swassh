name: Measure unchanged SQLite spool across allocated Windows QA volumes
on:
  push:
    branches: [diagnostics/c156-windows-storage-experiment]
permissions:
  contents: read
jobs:
  fleet-profile:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retain observer outside the unchanged application source
        shell: pwsh
        run: Copy-Item -LiteralPath '.github/diagnostics/native_storage_experiment.py' -Destination "$env:RUNNER_TEMP/swassh-storage-experiment.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5ee5b56572e9fc92d64bc1f3447a93678bd18bfd
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Verify exact observer and approved detached review
        shell: pwsh
        run: |
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$env:RUNNER_TEMP/swassh-storage-experiment.py").Hash.ToLowerInvariant() -ne '77d26e6e748a6b10acc6e264ca9f8490d4ad4861d07e4aa4e865d357dd2ef881') { throw 'Observer identity mismatch' }
          & curl.exe --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 --max-filesize 1399933 --output "$env:RUNNER_TEMP/swassh-approved-review.json" https://raw.githubusercontent.com/irivengroup/swassh/0ccf2df279733b8ded0d714b51169db3b0357d4f/.sast-approval/review.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath "$env:RUNNER_TEMP/swassh-approved-review.json").Length -ne 1399933) { throw 'Review length mismatch' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath "$env:RUNNER_TEMP/swassh-approved-review.json").Hash.ToLowerInvariant() -ne '62e93faf3de43884f6fa8b0c2e0fe7dc7a3ad78d9958130a42967f74649e60f6') { throw 'Review identity mismatch' }
      - name: Compare default and workspace volumes with identical 1000-record SQLite work
        id: diagnostic
        shell: pwsh
        timeout-minutes: 13
        run: |
          $env:SWASSH_DIAG_SOURCE = $env:GITHUB_WORKSPACE
          $env:SWASSH_DIAG_OUTPUT = "$env:RUNNER_TEMP/swassh-storage-experiment"
          $env:SWASSH_DIAG_REVIEW = "$env:RUNNER_TEMP/swassh-approved-review.json"
          $env:SWASSH_DIAG_ALT_TEMP = Split-Path -Parent $env:GITHUB_WORKSPACE
          & python -B "$env:RUNNER_TEMP/swassh-storage-experiment.py" *> "$env:RUNNER_TEMP/swassh-storage-experiment.log"
          exit $LASTEXITCODE
      - name: Retain profiles and every observed outcome
        if: ${{ always() && (steps.diagnostic.outcome == 'success' || steps.diagnostic.outcome == 'failure' || steps.diagnostic.outcome == 'cancelled') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-storage-experiment-c156
          path: |
            ${{ runner.temp }}/swassh-storage-experiment/
            ${{ runner.temp }}/swassh-storage-experiment.log
          if-no-files-found: error

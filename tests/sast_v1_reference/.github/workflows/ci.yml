name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Signed native OpenSSH and rsync integration prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          keydir=$(mktemp -d)
          trap 'rm -rf -- "$keydir"' EXIT
          fingerprint=72BBF83452B11E5B5A8F99123CC6C2BBC7F3DB85
          curl --fail --silent --show-error --location "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fingerprint" -o "$keydir/key.asc"
          gpg --batch --dearmor --output "$keydir/key.gpg" "$keydir/key.asc"
          gpg --batch --show-keys --with-colons "$keydir/key.gpg" | grep -F "fpr:::::::::$fingerprint:"
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$keydir/key.gpg" /etc/apt/keyrings/swassh-rsync.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/swassh-rsync.gpg] https://ppa.launchpadcontent.net/rsyncproject/rsync/ubuntu noble main' | sudo tee /etc/apt/sources.list.d/swassh-rsync.list
          sudo apt-get update
          sudo apt-get install -y openssh-server openssh-client rsync=3.5.1-1ppa~noble1
      - name: Native authentication fixture prerequisites
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y krb5-kdc krb5-admin-server krb5-user
      - name: Standard-library QA and DDD dependency boundaries
        run: python scripts/verify.py
      - name: Wiki hierarchy, navigation, fences and local links
        run: python scripts/wiki.py
      - name: Bounded local core benchmarks
        if: matrix.python == '3.12'
        run: python benchmarks/core.py --operations 8 --workers 2 --output validation/core-benchmarks.json
      - name: Native guardian descendants, budget recovery and pinned Windows directories
        run: python -m unittest discover -s tests -p test_improvements.py -v
        env:
          PYTHONPATH: src
      - run: python scripts/coverage.py
      - name: Authenticated SSH, device dialogue, ProxyJump and verified transfers without skips
        if: runner.os == 'Linux'
        run: python scripts/native_network_gate.py
      - name: Durable scheduling, concurrent manual invocations and no replay
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: python scripts/qualify_schedule.py --iterations 50
        env:
          PYTHONPATH: src
      - name: Password and Kerberos authentication in private namespaces, without skips
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        run: sudo "$(which python)" scripts/native_auth_gate.py
      - run: python scripts/build.py
      - name: Offline wheel and source installation in fresh environments
        run: python scripts/validate_installation.py
      - name: Real pip index deployment and automatic POSIX PATH
        run: python scripts/validate_deployment.py
      - run: python scripts/package.py
      - name: Install wheel without dependencies
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - run: swassh --version
      - name: Installed run CLI syntax
        run: swassh run 'uname -r' -H example --plan-only
      - name: Installed command output and PATH setup contracts
        run: |
          swassh run 'ip a' -H example --show-output --output-lines 0 --plan-only
          python -m swassh setup-path --help
      - name: Installed schedule CLI and UTC planning
        run: swassh schedule 'uname -r' -H example --at '2099-01-01 00:00' --plan-only
      - name: Installed desired state, workflow and tunnel planning
        run: |
          swassh converge --action-file examples/desired-state.json -H example --plan-only
          swassh workflow --workflow-file examples/workflow.json --plan-only
          swassh tunnel -H example --local-port 18443 --remote-host service.internal --remote-port 443 --plan-only
      - run: swassh push -H example --source ./data/ --destination /srv/data/ --plan-only
      - run: swassh pull -H example --source /srv/data/ --destination ./downloads/ --plan-only
      - name: Installed improvements CLI contracts
        run: |
          swassh run 'true' -H example --adaptive --progress --plan-only
          swassh push -H example --source ./data/ --destination /srv/data/ --dry-run --plan-only
          swassh push -H example --source ./release.tar --destination /srv/release.tar --verify-sha256 --plan-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        with:
          name: distributions
          path: dist/
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # QA dependencies stay outside SWASSH's standard-library-only runtime.
      - name: Install hash-locked QA scanner
        run: |
          python -m venv .qa-bandit
          .qa-bandit/bin/python -I -m pip --isolated install --require-hashes --only-binary=:all: --no-deps --requirement .github/bandit-requirements.txt
          .qa-bandit/bin/python -I -m pip check
      - name: Raw Bandit gate without suppressions
        run: .qa-bandit/bin/python -I -B -m bandit --recursive src tests scripts build_support benchmarks --ignore-nosec --format json --output bandit-full.json
      - name: Preserve the unfiltered scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raw-bandit-report
          path: bandit-full.json
          if-no-files-found: error

[build-system]
requires = []
build-backend = "swassh_build"
backend-path = ["build_support"]

[project]
name = "swassh"
version = "2.0.0"
description = "Massively parallel SSH execution, built like a swarm."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alfred TCHONDJO"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: SunOS/Solaris",
    "Operating System :: POSIX :: AIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
swassh = "swassh.interfaces.cli:main"
swassh-clean-restore = "swassh.interfaces.restore_cleanup:main"
swassh-restore-workflows = "swassh.interfaces.restore_workflows:main"
